<button
  type="button"
  class="picker-trigger"
  [disabled]="disabled()"
  [attr.aria-expanded]="open()"
  aria-haspopup="dialog"
  (click)="show()"
>
  <span>{{ selectedOption()?.label ?? placeholder() }}</span>
  <span class="material-symbols-rounded" aria-hidden="true">expand_more</span>
</button>

@if (open()) {
  <div class="picker-overlay">
    <button
      class="picker-backdrop"
      type="button"
      aria-label="Close options"
      (click)="close()"
    ></button>
    <section class="picker-sheet" role="dialog" aria-modal="true" [attr.aria-label]="sheetTitle()">
      <header>
        <div>
          <span class="eyebrow">Stillora</span>
          <strong>{{ sheetTitle() }}</strong>
        </div>
        <button class="icon-button" type="button" aria-label="Close options" (click)="close()">
          <span class="material-symbols-rounded" aria-hidden="true">close</span>
        </button>
      </header>
      <div class="option-list" role="listbox" [attr.aria-label]="sheetTitle()">
        @for (option of options(); track option.value) {
          <button
            type="button"
            class="picker-option"
            [class.selected]="option.value === value()"
            [disabled]="option.disabled"
            role="option"
            [attr.aria-selected]="option.value === value()"
            (click)="select(option.value)"
          >
            @if (option.icon) {
              <span class="option-icon material-symbols-rounded" aria-hidden="true">{{
                option.icon
              }}</span>
            }
            <span class="option-copy">
              <strong>{{ option.label }}</strong>
              @if (option.detail) {
                <small>{{ option.detail }}</small>
              }
            </span>
            @if (option.value === value()) {
              <span class="option-check material-symbols-rounded" aria-hidden="true">check</span>
            }
          </button>
        }
      </div>
    </section>
  </div>
}
